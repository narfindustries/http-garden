# Docker Desktop (Windows) runs containers in a VM, so their IPs aren't reachable from the host.
# This override publishes every service on a random port bound to 127.0.0.1 only;
# tools/targets.py reads the assigned ports from Docker, so nothing needs to be configured by hand.
#
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up
#
services:
  aiohttp:
    ports:
      - "127.0.0.1::80"
  apache_httpd:
    ports:
      - "127.0.0.1::80"
  apache_httpd_proxy:
    ports:
      - "127.0.0.1::80"
